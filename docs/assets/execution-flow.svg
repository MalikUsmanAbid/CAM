<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-labelledby="title desc"><title id="title">CAM execution pipeline</title><desc id="desc">The workspace sends requests through an authenticated local API. Model proposals pass current policy and scoped approvals before controlled execution. Results and audit evidence return to the workspace.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#83dce6"/></marker></defs><rect width="1280" height="210" rx="16" fill="#0d1820"/><g stroke="#335261" fill="#142732"><rect x="24" y="44" width="180" height="100" rx="12"/><rect x="234" y="44" width="180" height="100" rx="12"/><rect x="444" y="44" width="180" height="100" rx="12"/><rect x="654" y="44" width="180" height="100" rx="12" stroke="#83dce6"/><rect x="864" y="44" width="180" height="100" rx="12"/><rect x="1074" y="44" width="180" height="100" rx="12"/></g><g stroke="#83dce6" stroke-width="2" marker-end="url(#arrow)"><path d="M205 94H230"/><path d="M415 94H440"/><path d="M625 94H650"/><path d="M835 94H860"/><path d="M1045 94H1070"/></g><g fill="#eef7fa" font-family="Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle"><text x="114" y="92">CAM workspace</text><text x="324" y="83">Authenticated</text><text x="324" y="109">local API</text><text x="534" y="92">Model proposal</text><text x="744" y="83">Current policy</text><text x="744" y="109">Scoped approval</text><text x="954" y="83">Controlled</text><text x="954" y="109">executor</text><text x="1164" y="83">Results and</text><text x="1164" y="109">audit evidence</text></g><text x="640" y="183" fill="#a7bdc8" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Results return to the workspace. Models propose; the backend authorizes.</text></svg>
